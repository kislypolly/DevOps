services:
  app:
    image: nginx:stable-alpine
    volumes:
      - ./app/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - hw1-network

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - hw1-network

networks:
  hw1-network:
    driver: bridge
